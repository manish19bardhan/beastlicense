<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>License Manager</title><style>body{font-family:Arial,sans-serif;background:#0b1020;color:#eef2ff;margin:0}.wrap{max-width:1100px;margin:40px auto;padding:20px}.card{background:#151d33;border:1px solid #283451;border-radius:16px;padding:20px;margin-bottom:20px}input,select,button{padding:11px;border-radius:9px;border:1px solid #35415f;background:#0d1427;color:#fff}button{cursor:pointer;background:#2d6cdf;border:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.nav{display:flex;gap:15px;margin-bottom:20px}.nav a{color:#9ec1ff;text-decoration:none}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #283451;text-align:left;font-size:13px}.ok{color:#6ee7b7}.err{color:#fb7185}.key{word-break:break-all;font-family:monospace}.stats{font-size:25px;font-weight:bold}</style></head><body><div class="wrap"><div class="nav"><a href="/">Dashboard</a><a href="/licenses">Licenses</a><a href="/logout">Logout</a></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="card {{'ok' if cat=='success' else 'err'}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></body></html>
