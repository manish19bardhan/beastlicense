<script>
(function () {
  const form = document.getElementById("loginForm");
  const username = document.getElementById("username");
  const password = document.getElementById("password");
  const remember = document.getElementById("remember");
  const toggle = document.getElementById("togglePassword");

  // Password visibility.
  if (password && toggle) {
    function setEye(isVisible) {
      toggle.classList.toggle("is-visible", isVisible);
      toggle.setAttribute("aria-label", isVisible ? "Hide password" : "Show password");
      toggle.title = isVisible ? "Hide password" : "Show password";
    }

    password.addEventListener("focus", () => toggle.classList.add("show"));
    password.addEventListener("input", () => toggle.classList.add("show"));
    password.addEventListener("blur", () => {
      if (!password.value) toggle.classList.remove("show");
    });
    toggle.addEventListener("mousedown", e => e.preventDefault());
    toggle.addEventListener("click", function () {
      const visible = password.type === "text";
      password.type = visible ? "password" : "text";
      setEye(!visible);
    });
  }

  // Let the browser's password manager offer "Save password?".
  // No password is written to localStorage or sent anywhere extra.
  if (form) {
    form.addEventListener("submit", function () {
      if (!remember || !remember.checked || !username.value || !password.value) return;

      if ("PasswordCredential" in window && navigator.credentials && navigator.credentials.store) {
        try {
          const credential = new PasswordCredential({
            id: username.value,
            password: password.value,
            name: username.value
          });
          navigator.credentials.store(credential).catch(() => {});
        } catch (_) {}
      }
    });
  }

  // Ask the browser for a previously saved credential and autofill it.
  // Chrome/Edge may still require the user to approve the browser's password UI.
  if (navigator.credentials && navigator.credentials.get) {
    navigator.credentials.get({
      password: true,
      mediation: "optional"
    }).then(function (credential) {
      if (!credential) return;
      if (credential.id && !username.value) username.value = credential.id;
      if (credential.password && !password.value) {
        password.value = credential.password;
        if (toggle) toggle.classList.add("show");
      }
    }).catch(() => {});
  }
})();
</script>
