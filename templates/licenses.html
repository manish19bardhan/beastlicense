{% extends 'base.html' %}{% block content %}<h1>Licenses</h1><div class="card"><form><input name="q" value="{{q}}" placeholder="Search customer / plan / key"><button>Search</button></form></div><div class="card"><table><tr><th>Customer</th><th>Plan</th><th>Expires</th><th>Active</th><th>HWID</th><th>Actions</th></tr>{% for r in rows %}<tr><td>{{r.customer}}</td><td>{{r.plan}}</td><td>{{r.expires}}</td><td>{{'Yes' if r.active else 'No'}}</td><td>{{'Activated' if r.hwid else 'Unused'}}</td><td><form style="display:inline" method="post" action="/action/{{'revoke' if r.active else 'restore'}}"><input type="hidden" name="license_key" value="{{r.license_key}}"><button>{{'Revoke' if r.active else 'Restore'}}</button></form> <form style="display:inline" method="post" action="/action/reset"><input type="hidden" name="license_key" value="{{r.license_key}}"><button>Reset HWID</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
